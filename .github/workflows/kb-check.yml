name: kb-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kb-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kb-check:
    name: kb-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own python3 (3.12 on ubuntu-24.04) is enough: kb-check is stdlib-only.
      - run: python3 --version && python3 tools/kb-check.py
